services:
  # Unified Web Service: Serves both Express API Gateway and React PWA Frontend
  - type: web
    name: agriintel-platform
    env: node
    plan: free
    region: oregon
    buildCommand: npm --prefix client install && npm --prefix client run build && npm --prefix server install
    startCommand: npm --prefix server start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: REACT_APP_API_URL
        value: /api
      - key: REACT_APP_WS_URL
        value: /
